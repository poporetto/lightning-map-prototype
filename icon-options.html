<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intra-cloud icon options</title>
<style>
  body { margin:0; background:#1b1e23; color:#e9edf2;
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding:24px 28px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.sub { color:#9aa4b1; font-size:12.5px; margin:0 0 22px; }
  .grid { display:grid; grid-template-columns: 190px 150px 1fr; gap:0; align-items:center; }
  .head { color:#9aa4b1; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px;
    padding:0 0 8px; border-bottom:1px solid rgba(255,255,255,.12); }
  .row-name { padding:14px 12px 14px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .row-name b { display:block; font-size:13px; }
  .row-name span { color:#9aa4b1; font-size:11.5px; }
  .sizes, .field { padding:14px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .sizes { display:flex; align-items:flex-end; gap:14px; }
  .field { position:relative; height:120px; background:#2f3339;
    background-image:
      radial-gradient(120px 70px at 22% 55%, rgba(120,140,160,.30), transparent),
      radial-gradient(160px 90px at 62% 45%, rgba(110,130,150,.24), transparent);
    border-radius:8px; overflow:hidden; }
  .ic  svg path { fill:#4da6ff; stroke:#a8d5ff; stroke-width:14; }
  .cg  svg path { fill:#ffb020; stroke:#ffe27a; stroke-width:14; }
  .ic.thin svg path, .cg.thin svg path { stroke-width:0; }
  .icon { display:inline-block; }
  .icon svg { display:block; width:100%; height:100%;
    filter: drop-shadow(0 0 1.5px rgba(0,0,0,.85)); }
  .field .icon { position:absolute; }
  .cap { color:#9aa4b1; font-size:10px; text-align:center; margin-top:3px; }
</style>
</head>
<body>
<h1>Intra-cloud icon options</h1>
<p class="sub">Blue = intra-cloud candidate, orange = the cloud-to-ground bolt it has to stay distinct from.
Left column shows 12&nbsp;/&nbsp;16&nbsp;/&nbsp;20&nbsp;px; right column is a storm-density field at the size used on the map.</p>

<div class="grid">
  <div class="head">Option</div>
  <div class="head">At size</div>
  <div class="head">At storm density (with CG bolts)</div>
</div>
<div class="grid" id="grid"></div>

<script>
const P = {
  bolt:      { vb:'0 0 448 512', d:'M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288H175.5L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7H272.5L349.4 44.6z' },
  cloudBolt: { vb:'0 0 512 512', d:'M0 224c0 53 43 96 96 96h47.2L290 202.5c17.6-14.1 42.6-14 60.2 .2s22.8 38.6 12.8 58.8L333.7 320H352h64c53 0 96-43 96-96s-43-96-96-96c-.5 0-1.1 0-1.6 0c1.1-5.2 1.6-10.5 1.6-16c0-44.2-35.8-80-80-80c-24.3 0-46.1 10.9-60.8 28C256.5 24.3 219.1 0 176 0C114.1 0 64 50.1 64 112c0 7.1 .7 14.1 1.9 20.8C27.6 145.4 0 181.5 0 224zm330.1 3.6c-5.8-4.7-14.2-4.7-20.1-.1l-160 128c-5.3 4.2-7.4 11.4-5.1 17.8s8.3 10.7 15.1 10.7h70.1L177.7 488.8c-3.4 6.7-1.6 14.9 4.3 19.6s14.2 4.7 20.1 .1l160-128c5.3-4.2 7.4-11.4 5.1-17.8s-8.3-10.7-15.1-10.7H281.9l52.4-104.8c3.4-6.7 1.6-14.9-4.2-19.6z' },
  boltLightning: { vb:'0 0 384 512', d:'M0 256L28.5 28c2-16 15.6-28 31.8-28H228.9c15 0 27.1 12.1 27.1 27.1c0 3.2-.6 6.5-1.7 9.5L208 160H347.3c20.2 0 36.7 16.4 36.7 36.7c0 7.4-2.2 14.6-6.4 20.7l-192.2 281c-5.9 8.6-15.6 13.7-25.9 13.7h-2.9c-15.7 0-28.5-12.8-28.5-28.5c0-2.3 .3-4.6 .9-6.9L176 288H32c-17.7 0-32-14.3-32-32z' },
  // Custom: a double-ended zigzag flash. No tip, no ground attachment point.
  flash:     { vb:'0 0 512 256', d:'M8 128 L104 40 L176 152 L264 24 L344 168 L416 88 L504 128 L416 168 L344 88 L264 232 L176 104 L104 216 Z' },
  // Custom: symmetric spark / star-burst.
  spark:     { vb:'0 0 100 100', d:'M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z' }
};

function svg(p) { return '<svg viewBox="' + p.vb + '"><path d="' + p.d + '"/></svg>'; }

const OPTIONS = [
  { key:'a', name:'Current — same bolt, blue',   note:'Only colour separates the two types.',
    icon:P.bolt, cls:'ic', ratio:[12,19] },
  { key:'b', name:'Cloud + bolt',                note:'fa-cloud-bolt. Literal, but two shapes in one glyph.',
    icon:P.cloudBolt, cls:'ic', ratio:[19,19] },
  { key:'c', name:'Bolt rotated 90°',            note:'Same family, horizontal silhouette.',
    icon:P.bolt, cls:'ic', ratio:[19,13], rot:90 },
  { key:'d', name:'Double-ended zigzag flash',   note:'Custom. Spreads sideways, no ground tip.',
    icon:P.flash, cls:'ic thin', ratio:[20,10] },
  { key:'e', name:'Spark burst',                 note:'Custom. Abstract, densest-friendly.',
    icon:P.spark, cls:'ic thin', ratio:[11,11] }
];

/* Deterministic scatter so the density panels are comparable. */
function rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}

const grid = document.getElementById('grid');
for (const o of OPTIONS) {
  const [w, h] = o.ratio;
  const rot = o.rot ? 'transform:rotate(' + o.rot + 'deg);' : '';

  const name = document.createElement('div');
  name.className = 'row-name';
  name.innerHTML = '<b>' + o.name + '</b><span>' + o.note + '</span>';

  const sizes = document.createElement('div');
  sizes.className = 'sizes';
  sizes.innerHTML = [12, 16, 20].map(s => {
    const sw = Math.round(w * s / Math.max(w, h)), sh = Math.round(h * s / Math.max(w, h));
    return '<div><span class="icon ' + o.cls + '" style="width:' + sw + 'px;height:' + sh + 'px;' + rot + '">' +
      svg(o.icon) + '</span><div class="cap">' + s + '</div></div>';
  }).join('');

  const field = document.createElement('div');
  field.className = 'field';
  const r = rng(4242);
  let html = '';
  for (let i = 0; i < 210; i++) {
    // Cluster the scatter so it reads like a storm cell, not confetti.
    const cx = [0.24, 0.46, 0.66, 0.82][i % 4];
    const x = Math.min(0.97, Math.max(0.01, cx + (r() - 0.5) * 0.30));
    const y = Math.min(0.92, Math.max(0.02, 0.5 + (r() - 0.5) * 0.85));
    const isCg = r() < 0.13;
    if (isCg) {
      html += '<span class="icon cg" style="left:' + (x * 100) + '%;top:' + (y * 100) +
        '%;width:12px;height:19px"></span>';
    } else {
      html += '<span class="icon ' + o.cls + '" style="left:' + (x * 100) + '%;top:' + (y * 100) +
        '%;width:' + w + 'px;height:' + h + 'px;' + rot + '"></span>';
    }
  }
  field.innerHTML = html;
  field.querySelectorAll('.cg').forEach(e => e.innerHTML = svg(P.bolt));
  field.querySelectorAll('.icon:not(.cg)').forEach(e => e.innerHTML = svg(o.icon));

  grid.append(name, sizes, field);
}
</script>
</body>
</html>
