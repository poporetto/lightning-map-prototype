<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning strike icons</title>
<link rel="stylesheet" href="strike-icons.css">
<style>
  body { margin:0; padding:32px; background:#2f3339; color:#e9edf2;
    font:14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  p  { margin:0 0 24px; color:#9aa4b1; font-size:12.5px; }
  .row { display:flex; align-items:center; gap:26px; margin-bottom:20px; }
  .row .label { width:200px; color:#9aa4b1; font-size:12.5px; }
  button { background:rgba(255,255,255,.08); color:#e9edf2;
    border:1px solid rgba(255,255,255,.16); border-radius:7px;
    padding:6px 13px; font:inherit; font-size:12.5px; cursor:pointer; }
  code { background:rgba(255,255,255,.09); padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>

<h1>Lightning strike icons</h1>
<p>Icons are <code>&lt;img&gt;</code> references to the SVG files — nothing is inlined. 15&times;20&nbsp;px.<br>
The colour class is still required: it sets the ring colour, the halo colour, and which point the icon is anchored to.</p>

<div class="row">
  <span class="label">Resting — <code>.strike</code></span>
  <span class="strike strike-orange"><span class="strike-glyph"><img src="lightning-orange.svg" alt="Cloud-to-ground strike"></span></span>
  <span class="strike strike-blue"><span class="strike-glyph"><img src="lightning-blue.svg" alt="Intra-cloud strike"></span></span>
</div>

<div class="row">
  <span class="label">Recent — <code>.strike-fresh</code></span>
  <span class="strike strike-orange strike-fresh"><span class="strike-glyph"><img src="lightning-orange.svg" alt=""></span></span>
  <span class="strike strike-blue strike-fresh"><span class="strike-glyph"><img src="lightning-blue.svg" alt=""></span></span>
</div>

<div class="row">
  <span class="label">Arriving — <code>.strike-arrive</code></span>
  <span class="strike strike-orange" id="a"><span class="strike-ring"></span><span class="strike-glyph"><img src="lightning-orange.svg" alt=""></span></span>
  <span class="strike strike-blue" id="b"><span class="strike-ring"></span><span class="strike-glyph"><img src="lightning-blue.svg" alt=""></span></span>
  <button id="play">Replay</button>
</div>

<script>
/* Add .strike-arrive to animate; remove it on animationend and the icon settles
   into whatever state it is left in. */
function arrive(el) {
  el.classList.remove('strike-arrive', 'strike-fresh');
  void el.offsetWidth;                        // restart the animation
  el.classList.add('strike-arrive');
  el.addEventListener('animationend', function done(ev) {
    if (ev.animationName !== 'strike-bloom') return;
    el.removeEventListener('animationend', done);
    el.classList.remove('strike-arrive');
    el.classList.add('strike-fresh');          // hand over to the static halo
  });
}
const play = () => ['a', 'b'].forEach(id => arrive(document.getElementById(id)));
document.getElementById('play').addEventListener('click', play);
play();
</script>
</body>
</html>
